[package]
name = "audiomeda-ui"
version = "0.1.0"
edition = "2024"

[lib]
# the _lib suffix keeps the lib name from clashing with the bin on Windows
name = "audiomeda_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
audiomeda-protocol = { path = "../../protocol" }
png = "0.18.1"
base64 = "0.23.1"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
windows-core = "0.62.2"
