[package]
name = "audiomeda-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
audiomeda-protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
windows-core = "0.62.2"
